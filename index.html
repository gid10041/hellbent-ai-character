<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>캐릭터 대화 관찰</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

/* ---------- 디자인 토큰 (DESIGN-clay 기준) ---------- */
:root{
  --canvas:#fffaf0;        /* 크림 화이트 캔버스 */
  --surface-soft:#faf5e8;  /* 패널 배경 */
  --surface-card:#f5f0e0;  /* 말풍선 배경 */
  --ink:#0a0a0a;
  --body:#3a3a3a;
  --muted:#6a6a6a;
  --muted-soft:#9a9a9a;
  --hairline:#e5e5e5;
  --primary:#0a0a0a;
  --primary-disabled:#e5e5e5;
  --coral:#ff6b5a;         /* 녹화 중 강조 */
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  background:var(--canvas);color:var(--ink);overflow:hidden;
  font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;
}
button,input{font-family:inherit}

/* ---------- 설정 화면 ---------- */
#setup{position:fixed;inset:0;background:var(--canvas);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 24px;z-index:10;overflow:auto}
#setup h1{font-size:56px;font-weight:500;line-height:1.05;letter-spacing:-2px;margin:0 0 48px;text-align:center}
.box{width:min(560px,100%);margin-bottom:32px}
.box h2{font-size:12px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--hairline);background:transparent;color:var(--muted);border-radius:9999px;padding:8px 16px;cursor:pointer;font-size:14px;font-weight:500;line-height:1.4}
.chip.on{background:var(--surface-card);color:var(--ink);border-color:var(--ink)}
.chip:disabled{opacity:.35;cursor:not-allowed}
input[type=text]{width:100%;margin-top:12px;height:44px;padding:12px 16px;border:1px solid var(--hairline);border-radius:12px;background:var(--canvas);color:var(--ink);font-size:16px;outline:none}
input[type=text]:focus{border-color:var(--ink)}
.hint{font-size:13px;color:var(--muted-soft);margin-top:8px}
#keyBox input[type=password]{width:100%;margin-top:12px;height:44px;padding:12px 16px;border:1px solid var(--hairline);border-radius:12px;background:var(--canvas);color:var(--ink);font-size:16px;outline:none}
#keyBox input[type=password]:focus{border-color:var(--ink)}
#keyBox label{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:13px;color:var(--muted)}
.link{border:none;background:none;color:var(--ink);text-decoration:underline;cursor:pointer;font-size:13px;padding:0}
#startBtn{height:44px;padding:12px 20px;font-size:14px;font-weight:600;line-height:1;border:none;border-radius:12px;background:var(--primary);color:#fff;cursor:pointer}
#startBtn:disabled{background:var(--primary-disabled);color:var(--muted);cursor:not-allowed}

/* ---------- 무대 ---------- */
#stage{display:none;height:100vh;grid-template-columns:minmax(0,50vh) minmax(0,1fr) minmax(0,50vh);grid-template-rows:minmax(0,1fr);gap:0;padding:0;overflow:hidden}
.side{display:block;position:relative;height:100%;min-height:0;padding:0;background:none;border-radius:0;overflow:hidden;transition:opacity .4s}
.side.dim{opacity:.45}
.portrait{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:20px}
.portrait .label{position:relative;z-index:1;font-size:13px;font-weight:600;line-height:1.4;padding:4px 12px;border-radius:9999px;color:var(--ink)}
.sprite{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.placeholder{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted-soft);font-size:14px;gap:4px;background:#e9e4d6}

.center{display:flex;flex-direction:column;min-width:0;min-height:0;height:100%;overflow:hidden;padding:24px;background:var(--canvas);border-left:1px solid var(--hairline);border-right:1px solid var(--hairline);border-radius:0}
#log{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:16px;padding:4px 8px}

.msg{position:relative;max-width:calc(100% - 100px);animation:rise .35s ease-out}
.msg.left{align-self:flex-start}
.msg.right{align-self:flex-end}
.msg .who{font-size:13px;font-weight:600;color:var(--muted);margin:0 4px 6px}
.msg.right .who{text-align:right}
.bubble{position:relative;background:none;border:none;padding:14px 18px;font-size:16px;line-height:1.55;color:var(--tc,#fff);white-space:pre-wrap;word-break:keep-all;min-width:0}
.bubble-shape{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;z-index:0;pointer-events:none}
.bubble-shape path{fill:var(--c)}
.bubble-text{position:relative;z-index:1;display:block}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

#sdRow{display:flex;justify-content:space-around;align-items:center;gap:10px;padding-top:16px;min-height:var(--sdh,180px)}
.sd{width:var(--sdw,140px);height:var(--sdh,180px);display:flex;align-items:center;justify-content:center;transition:opacity .3s;flex-shrink:0}
.sd.dim{opacity:.4}
.sd img{width:100%;height:100%;object-fit:contain;display:block}
.sd .placeholder{border:none;border-radius:0;min-height:0;font-size:12px;background:transparent}

#nextRow{display:flex;justify-content:center;align-items:center;gap:12px;padding-top:12px}
.next-btn{position:relative;width:56px;height:56px;border-radius:50%;border:1px solid var(--ink);background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.next-btn svg{margin-left:3px}
.next-btn:disabled{background:var(--primary-disabled);border-color:var(--hairline);color:var(--muted);cursor:not-allowed}
.next-btn .spin{display:none;position:absolute;width:24px;height:24px;border:3px solid var(--hairline);border-top-color:var(--ink);border-radius:50%;animation:spin .8s linear infinite}
.next-btn.loading svg{display:none}
.next-btn.loading .spin{display:block}
@keyframes spin{to{transform:rotate(360deg)}}
#controls{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding-top:12px;margin-top:8px;border-top:1px solid var(--hairline);font-size:13px;color:var(--muted)}
#controls > span:last-child{display:flex;gap:8px;flex-wrap:wrap}
#controls button{height:36px;padding:8px 14px;border:1px solid var(--hairline);background:var(--canvas);color:var(--ink);border-radius:12px;cursor:pointer;font-size:14px;font-weight:600;line-height:1}
#stopBtn{background:var(--primary);color:#fff;border-color:var(--primary)}
#controls button.icon-btn{width:40px;height:40px;padding:0;display:inline-flex;align-items:center;justify-content:center;border-radius:50%}
#controls button.rec{background:var(--coral);border-color:var(--coral);color:var(--ink)}

/* ---------- 다크 모드 ---------- */
body.dark{--canvas:#000000;--surface-soft:#0d0d0d;--surface-card:#1a1a1a;--ink:#ffffff;--body:#ffffff;--muted:#b0b0b0;--muted-soft:#7a7a7a;--hairline:#2e2e2e;--primary:#ffffff;--primary-disabled:#2e2e2e;color-scheme:dark}
body.dark #startBtn{background:#ffffff;color:#000000}
body.dark #startBtn:disabled{background:#2e2e2e;color:#7a7a7a}
body.dark #stopBtn{background:#ffffff;color:#000000;border-color:#ffffff}
body.dark .next-btn{background:#ffffff;color:#000000;border-color:#ffffff}
body.dark .next-btn:disabled{background:#2e2e2e;color:#7a7a7a;border-color:#2e2e2e}
body.dark .placeholder{background:#1a1a1a}
body.dark .chip.on{color:#ffffff}
body.dark #controls button.rec{color:#000000}

.cmd-round{width:44px;height:44px;border-radius:50%;border:1px solid var(--hairline);background:var(--canvas);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.cmd-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:20;padding:24px}
.cmd-overlay[hidden]{display:none}
.cmd-modal{width:min(640px,100%);background:var(--canvas);border:1px solid var(--hairline);border-radius:24px;padding:24px}
.cmd-title{font-size:12px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.cmd-row{display:flex;gap:8px;align-items:center}
.cmd-row input{flex:1;min-width:0;height:44px;padding:12px 16px;border:1px solid var(--hairline);border-radius:12px;background:var(--canvas);color:var(--ink);font-size:16px;outline:none}
.cmd-row input:focus{border-color:var(--ink)}
.cmd-btn{height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--hairline);background:var(--canvas);color:var(--ink);font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.cmd-btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
body.dark .cmd-btn.primary{background:#fff;color:#000;border-color:#fff}

.msg-tools{position:absolute;display:flex;gap:8px;z-index:2}
.cmd-round.tool{width:40px;height:40px;background:var(--canvas)}
.cmd-col{display:flex;flex-direction:column;gap:12px}
.cmd-col textarea{width:100%;padding:12px 16px;border:1px solid var(--hairline);border-radius:12px;background:var(--canvas);color:var(--ink);font-size:16px;line-height:1.5;resize:vertical;outline:none;font-family:inherit}
.cmd-col textarea:focus{border-color:var(--ink)}
.cmd-actions{display:flex;justify-content:flex-end;gap:8px}

.list-round{width:44px;height:44px;border-radius:50%;border:1px solid var(--hairline);background:var(--canvas);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;flex-shrink:0}
#listBtnSetup{position:fixed;top:20px;right:20px;z-index:5}
.center-head{display:flex;justify-content:flex-end;height:44px;flex-shrink:0;margin:-8px -8px 0 0}
.list-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:25;padding:24px}
.list-overlay[hidden]{display:none}
.list-panel{width:min(760px,100%);max-height:85vh;overflow:auto;background:var(--canvas);border:1px solid var(--hairline);border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:16px}
.list-head{display:flex;justify-content:space-between;align-items:center;font-size:16px;font-weight:600}
.list-body{display:flex;flex-direction:column;gap:12px}
.list-empty{color:var(--muted);text-align:center;padding:32px 0}
.chat-card{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:20px 24px;border:1px solid var(--hairline);border-radius:24px;background:var(--surface-soft)}
.chat-info{min-width:0}
.chat-title{font-size:16px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-meta{font-size:13px;color:var(--muted);margin-top:4px}
.chat-actions{display:flex;gap:8px;flex-shrink:0}

.drawer{position:fixed;left:0;right:0;bottom:0;height:80vh;z-index:25;background:var(--canvas);border-top:1px solid var(--hairline);border-radius:24px 24px 0 0;padding:24px;display:flex;flex-direction:column;gap:16px;transform:translateY(100%);visibility:hidden;transition:transform .35s ease,visibility .35s}
.drawer.open{transform:translateY(0);visibility:visible}
.drawer .list-body{flex:1;min-height:0;overflow-y:auto;max-width:760px;width:100%;margin:0 auto}

#standingBtn.on{background:var(--primary);color:var(--canvas);border-color:var(--primary)}

@media (max-width:700px){
  #setup h1{font-size:36px;letter-spacing:-1px}
  #stage{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr) auto;padding:8px;gap:8px}
  .side{height:160px}
  .side:first-child,.side:last-child{display:none}
}
</style>
</head>
<body>

<!-- ============ 설정 화면 ============ -->
<div id="setup">
  <button id="listBtnSetup" class="list-round" aria-label="대화 목록" title="대화 목록"></button>
  <h1>캐릭터 대화 관찰</h1>

  <div class="box">
    <h2>화면 모드</h2>
    <div class="chips" id="themeChips"></div>
  </div>

  <div class="box">
    <h2>AI 대화 언어</h2>
    <div class="chips" id="langChips"></div>
  </div>

  <div class="box" id="keyBox">
    <h2>AI 모델 · API 키</h2>
    <div class="chips" id="modelChips"></div>
    <input type="password" id="apiKey" placeholder="본인의 API 키를 입력하세요" autocomplete="off" spellcheck="false">
    <input type="text" id="relayUrl" placeholder="GPT-6 Luna 중계기 주소 (https://...workers.dev)" style="display:none" autocomplete="off" spellcheck="false">
    <label><input type="checkbox" id="rememberKey"> 이 브라우저에 키 저장 (공용 PC에서는 체크하지 마세요)</label>
    <div class="hint"><button id="clearKey" class="link">키 지우기</button></div>
    <div class="hint" id="keyStatus"></div>
  </div>

  <div class="box">
    <h2>등장 캐릭터 선택 (2~4명)</h2>
    <div class="chips" id="charChips"></div>
  </div>

  <div class="box">
    <h2>주제</h2>
    <div class="chips" id="topicChips"></div>
    <input type="text" id="customTopic" placeholder="주제를 직접 입력하세요" style="display:none">
    <div class="hint" id="topicHint"></div>
  </div>

  <button id="startBtn" disabled>대화 시작</button>
</div>

<!-- ============ 무대 ============ -->
<div id="stage">
  <div class="side" id="leftSide"></div>
  <div class="center">
    <div class="center-head"><button id="listBtnStage" class="list-round" aria-label="대화 목록" title="대화 목록"></button></div>
    <div id="log"></div>
    <div id="sdRow"></div>
    <div id="nextRow">
      <button id="nextBtn" class="next-btn" aria-label="다음 대사" disabled>
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
        <span class="spin"></span>
      </button>
      <button id="standingBtn" class="cmd-round tool" title="앞으로의 전개 지시"></button>
    </div>
    <div id="controls">
      <span id="status">주제: -</span>
      <span>
        <button id="stopBtn" class="icon-btn" title="일시정지" aria-label="일시정지"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor"/></svg></button>
        <button id="imgBtn" class="icon-btn" title="이미지 저장" aria-label="이미지 저장"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="9" cy="10" r="2" fill="currentColor"/><path d="M4 18l5-5 4 4 2-2 5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></button>
        <button id="recBtn" class="icon-btn" title="녹화" aria-label="녹화"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="6" fill="#ff3b47"/></svg></button>
        <button id="shotBtn" class="icon-btn" title="화면 캡쳐" aria-label="화면 캡쳐"></button>
        <button id="saveBtn" class="icon-btn" title="대화 저장" aria-label="대화 저장"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></button>
        <button id="themeBtn" class="icon-btn" title="다크 모드" aria-label="다크 모드"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></button>
        <button id="resetBtn" class="icon-btn" title="다시 설정" aria-label="다시 설정"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M4 4v5h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </span>
    </div>
  </div>
  <div class="side" id="rightSide"></div>
</div>

<div id="cmdOverlay" class="cmd-overlay" hidden>
  <div class="cmd-modal" role="dialog" aria-modal="true" aria-label="마지막 대사 수정">
    <div class="cmd-title">마지막 대사 수정</div>
    <form id="cmdForm" class="cmd-col" autocomplete="off">
      <textarea id="cmdInput" rows="3" maxlength="400"></textarea>
      <div class="cmd-actions">
        <button type="button" id="cmdCancel" class="cmd-btn">취소</button>
        <button type="submit" class="cmd-btn primary">확인</button>
      </div>
    </form>
  </div>
</div>

<div id="dirOverlay" class="cmd-overlay" hidden>
  <div class="cmd-modal" role="dialog" aria-modal="true" aria-label="마지막 대사 방향 지정">
    <div class="cmd-title">마지막 대사 방향 지정</div>
    <form id="dirForm" class="cmd-row" autocomplete="off">
      <input type="text" id="dirInput" maxlength="200" placeholder="예) 더 짓궂게, 한숨 쉬면서 말하기">
      <button type="button" id="dirCancel" class="cmd-btn">취소</button>
      <button type="submit" class="cmd-btn primary">확인</button>
    </form>
  </div>
</div>

<div id="listDrawer" class="drawer" role="dialog" aria-label="대화 목록">
  <div class="list-head"><span>대화 목록</span></div>
  <div id="listBody" class="list-body"></div>
</div>

<div id="standingOverlay" class="cmd-overlay" hidden>
  <div class="cmd-modal" role="dialog" aria-modal="true" aria-label="앞으로의 전개 지시">
    <div class="cmd-title">앞으로의 전개 지시 (삭제할 때까지 계속 유지)</div>
    <div class="cmd-col">
      <textarea id="standingInput" rows="4" maxlength="1000" placeholder="예) 둘이 점점 가까워지고, 레이시가 듀크의 연습실에 자주 찾아가는 쪽으로 흘러가면 좋겠어."></textarea>
      <div class="cmd-actions">
        <button type="button" id="standingDelete" class="cmd-btn">지시사항 삭제</button>
        <button type="button" id="standingCancel" class="cmd-btn">취소</button>
        <button type="button" id="standingSave" class="cmd-btn primary">저장</button>
      </div>
    </div>
  </div>
</div>

<script>
/* =====================================================================
   1. 캐릭터 설정
   - profile: 성격, 말투, 과거, 관계 등 요약 (매 턴 프롬프트에 포함됨)
   - sprites: 감정별 큰 초상화 이미지 (URL 또는 data:image/... 문자열)
     · sprites: 큰 초상화 (좌/우 패널에 표시)
     · sd: SD 전신(원형 프레임에 표시). 없으면 sprites.neutral 사용
   - color: 말풍선/강조 색
   ===================================================================== */
const SVG_OPEN = '<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">';
const ICONS = {
  pause: `<rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor"/>`,
  play: `<path d="M7 5v14l12-7z" fill="currentColor"/>`,
  image: `<rect x="3" y="4" width="18" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="9" cy="10" r="2" fill="currentColor"/><path d="M4 18l5-5 4 4 2-2 5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>`,
  rec: `<circle cx="12" cy="12" r="6" fill="#ff3b47"/>`,
  stop: `<rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor"/>`,
  save: `<path d="M6 3h12v18l-6-4-6 4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>`,

/* ---------- 스프라이트 ---------- */
function makeSprite(c, emotion, kind){
  let src;
  if(kind === 'sd'){
    // SD는 감정별 이미지(c.sd[감정]) 사용, 없으면 neutral, 그래도 없으면 큰 초상화 neutral
    const sd = (c.sd && typeof c.sd === 'object') ? c.sd : {};
    src = sd[emotion] || sd.neutral || (c.sprites && c.sprites.neutral) || '';
  }else{
    src = (c.sprites && (c.sprites[emotion] || c.sprites.neutral)) || '';
  }
  if(src){
    const img = document.createElement('img');
    img.src = src;
    img.className = kind === 'sd' ? '' : 'sprite';
    img.alt = nm(c);
    img.onerror = () => img.replaceWith(makeSprite({ ...c, sprites: {}, sd: {} }, emotion, kind));
    return img;
  }
  const p = document.createElement('div');
  p.className = 'placeholder';
  p.innerHTML = `<div>${nm(c)}</div><div style="font-size:11px">${emotion || 'neutral'}</div>`;
  return p;
}

/* ---------- 렌더: 큰 초상화(좌/우) ---------- */
function renderPortraits(speakerId){
  [['leftSide', state.left], ['rightSide', state.right]].forEach(([sideId, c]) => {
    const side = $(sideId);
    side.innerHTML = '';
    side.classList.toggle('dim', !!speakerId && c.id !== speakerId);
    const wrap = document.createElement('div');
    wrap.className = 'portrait';
    wrap.appendChild(makeSprite(c, state.emotion[c.id], 'big'));
    const label = document.createElement('div');
    label.className = 'label';
    label.textContent = nm(c);
    label.style.background = c.color;
    wrap.appendChild(label);
    side.appendChild(wrap);
  });
}

/* SD 크기: 캐릭터 수와 화면 폭에 맞춰 자동으로 줄어듦 (최대 140x180) */
function fitSD(){
  const row = $('sdRow');
  if(!row || row.clientWidth === 0) return;
  const n = Math.max(1, state.selected.length);
  const gap = 10;
  const avail = row.clientWidth - gap * (n - 1) - 8;
  const w = Math.max(48, Math.min(140, Math.floor(avail / n)));
  const h = Math.round(w * 180 / 140);
  row.style.setProperty('--sdw', w + 'px');
  row.style.setProperty('--sdh', h + 'px');
}
window.addEventListener('resize', fitSD);

function renderSD(speakerId){
  const row = $('sdRow');
  row.innerHTML = '';
  fitSD();
  state.selected.forEach(c => {
    const d = document.createElement('div');
    d.className = 'sd' + (speakerId === c.id ? ' active' : '') +
      (speakerId && speakerId !== c.id ? ' dim' : '');
    d.style.setProperty('--c', c.color);
    d.appendChild(makeSprite(c, state.emotion[c.id], 'sd'));
    row.appendChild(d);
  });
}

/* ---------- 말풍선 도형: 모서리 둥글게 + 부드러운 꼬리 ---------- */
const BUB_R = 26;
function bubblePoints(x, y, w, h, left){
  const R = BUB_R, pts = [];
  const arcPts = (cx, cy, r, a0, a1, n = 14) => {
    for(let i = 0; i <= n; i++){
      const a = (a0 + (a1 - a0) * i / n) * Math.PI / 180;
      pts.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]);
    }
  };
  const quadPts = (p0, c, p1, n = 12) => {
    for(let i = 1; i <= n; i++){
      const t = i / n;
      pts.push([
        (1-t)*(1-t)*p0[0] + 2*(1-t)*t*c[0] + t*t*p1[0],
        (1-t)*(1-t)*p0[1] + 2*(1-t)*t*c[1] + t*t*p1[1],
      ]);
    }
  };
  arcPts(x + R, y + R, R, 180, 270);            // 왼쪽 위
  arcPts(x + w - R, y + R, R, 270, 360);        // 오른쪽 위
  arcPts(x + w - R, y + h - R, R, 0, 90);       // 오른쪽 아래
  pts.push([x + 18, y + h]);                    // 아래 가장자리
  quadPts([x + 18, y + h], [x + 2, y + h + 2], [x - 12, y + h + 6]);   // 꼬리 바깥 곡선
  quadPts([x - 12, y + h + 6], [x - 1, y + h - 4], [x, y + h - 14]);   // 꼬리 안쪽 곡선
  pts.push([x, y + R]);
  return left ? pts : pts.map(([px, py]) => [2 * (x + w / 2) - px, py]);
}
function fitBubble(bubble, left){
  const w = bubble.offsetWidth, h = bubble.offsetHeight;
  if(!w || !h) return;
  const svg = bubble.querySelector('.bubble-shape');
  if(!svg) return;
  svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
  const d = bubblePoints(0, 0, w, h, left)
    .map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ') + ' Z';
  svg.querySelector('path').setAttribute('d', d);
}

/* ---------- Claude 호출 ---------- */
function buildPrompt(){
  const ids = state.selected.map(c => c.id).join(', ');
  // 고정 부분: 매 턴 동일 (프롬프트 캐싱 대상). 참여 캐릭터 프로필만 포함.
  const roster = state.selected.map(c => `## ${nm(c)} (id: ${c.id})\n${c.profile}`).join('\n\n');
  const langRule = state.lang === 'en'
    ? 'All dialogue must be written in English. Use the English character names.'
    : '대사는 모두 한국어로 작성한다. 캐릭터 이름도 한국어 이름을 쓴다.';
  const stable = `${COMMON_GUIDE}\n\n[언어]\n${langRule}\n\n[등장인물]\n${roster}${standingBlock()}\n\n[출력 형식]\n반드시 JSON 객체 하나만 출력한다. 설명이나 마크다운을 붙이지 않는다.\n{"speaker":"<id>","emotion":"<emotion>","text":"<대사>"}\nemotion은 다음 중 하나: ${EMOTIONS.join(', ')}\n사용 가능한 id: ${ids}`;

  // 변동 부분: 주제와 최근 대화 12개만 전달 (오래된 대화는 제외)
  const recent = state.history.slice(-12)
    .map(m => `${nm(charById(m.speaker))}(${m.emotion}): ${m.text}`).join('\n') || '(아직 대화 없음)';
  const topicLine = state.topicMode === FREE_TOPIC
    ? '자유 주제: 캐릭터들이 흥미롭게 이야기할 주제를 스스로 정해 자연스럽게 대화를 시작한다.'
    : state.topicText;
  const last = state.lastSpeaker ? nm(charById(state.lastSpeaker)) : '없음';
  const dynamic = `[주제]\n${topicLine}\n\n[최근 대화]\n${recent}\n\n[규칙]\n- 직전 발언자(${last})는 다음 발언자로 고르지 않는다.\n- 직전 대화에 자연스럽게 반응하는 발언 하나를 만든다.\n\n다음 발언 하나를 JSON으로 출력하라.`;
  return { stable, dynamic };
}

async function callClaude({ stable, dynamic }){
  if(!apiKey.trim()) throw new Error('API 키가 없습니다. 시작 화면에서 입력하세요.');
  return state.model === 'luna'
    ? callLunaViaRelay(stable, dynamic)
    : callClaudeDirect(stable, dynamic);
}

// Claude: 브라우저에서 직접 호출 (본인 키)
async function callClaudeDirect(stable, dynamic){
  const r = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
    },
    body: JSON.stringify({
      model: 'claude-sonnet-4-6',
      max_tokens: 120,
      system: [{ type: 'text', text: stable, cache_control: { type: 'ephemeral' } }],
      messages: [{ role: 'user', content: dynamic }],
    }),
  });
  const d = await r.json().catch(() => ({}));
  if(!r.ok || !d.content){
    throw new Error('Claude 오류 - ' + ((d.error && d.error.message) || ('HTTP ' + r.status)));
  }
  return d.content.map(i => i.text || '').join('');
}

// GPT-6 Luna: 중계기로 본인 키를 전달 (중계기는 키를 저장하지 않고 OpenAI에 그대로 전달)
async function callLunaViaRelay(stable, dynamic){
  const url = relayUrl();
  if(!url) throw new Error('GPT-6 Luna 중계기 주소를 입력하세요.');
  const r = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ key: apiKey, stable, dynamic }),
  });
  const d = await r.json().catch(() => ({}));
  if(!r.ok){
    throw new Error('Luna 오류 - ' + ((d.error && d.error.message) || ('HTTP ' + r.status)));
  }
  const text = extractOpenAIText(d);
  if(!text) throw new Error('모델 응답이 비어 있습니다.');
  return text;
}

// OpenAI Responses API 응답에서 글자만 꺼내기
function extractOpenAIText(data){
  if(typeof data.output_text === 'string') return data.output_text;
  const parts = [];
  for(const item of data.output || []){
    if(item.type !== 'message') continue;
    for(const c of item.content || []){
      if(c.type === 'output_text' && c.text) parts.push(c.text);
    }
  }
  return parts.join('');
}

function parseTurn(raw){
  const s = raw.indexOf('{'), e = raw.lastIndexOf('}');
  if(s < 0 || e < 0) throw new Error('JSON 없음');
  const o = JSON.parse(raw.slice(s, e + 1));
  if(!state.selected.some(c => c.id === o.speaker)) throw new Error('잘못된 speaker');
  if(!o.text || !o.text.trim()) throw new Error('빈 대사');
  if(!EMOTIONS.includes(o.emotion)) o.emotion = 'neutral';
  return o;
}

  // 진행 중이던 다음 대사는 수정 전 문장 기준이므로 폐기

/* =====================================================================

   ===================================================================== */
const IMG_W = 720, IMG_PAD = 28, IMG_MAX_H = 1800, LINE_H = 40;
const IMG_SD_W = 200, IMG_SD_H = 257;   // 저장 이미지의 SD 크기 (7:9 비율)
const IMG_GAP = 22, IMG_INNER = 16;     // SD와 말풍선 사이 간격, 가장자리 여백
const MSG_FONT = '28px "Malgun Gothic","Apple SD Gothic Neo",sans-serif';
const NAME_FONT = '22px "Malgun Gothic","Apple SD Gothic Neo",sans-serif';

function timeStamp(){ return new Date().toISOString().slice(0,19).replace(/[:T]/g,'-'); }

function downloadBlob(href, filename){
  const a = document.createElement('a');
  a.href = href; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
}

// 글자 단위로 줄바꿈 (한글 대응)
function wrapLines(ctx, text, maxW){
  const lines = [];
  text.split('\n').forEach(para => {
    let line = '';
    for(const ch of para){
      const test = line + ch;
      if(line && ctx.measureText(test).width > maxW){ lines.push(line); line = ch; }
      else line = test;
    }
    lines.push(line);
  });
  return lines;
}

// 말풍선 최대 폭: 전체 폭에서 여백, SD 폭, 간격을 뺀 나머지 (말풍선 밖으로 넘치지 않도록)
function bubbleMaxWidth(){
  return IMG_W - IMG_PAD * 2 - IMG_INNER * 2 - IMG_SD_W - IMG_GAP - 10;
}

// 발언 당시 감정의 SD 이미지 주소
function sdSrcFor(t){
  const c = charById(t.speaker);
  const sd = (c.sd && typeof c.sd === 'object') ? c.sd : {};
  return sd[t.emotion] || sd.neutral || (c.sprites && c.sprites.neutral) || '';
}

function layoutMessages(ctx){
  ctx.font = MSG_FONT;
  const maxBubbleW = bubbleMaxWidth();
  return state.history.map(t => {
    const c = charById(t.speaker);
    // 좌우 여백 18px씩을 뺀 폭 안에서만 줄바꿈 → 글자가 말풍선 밖으로 나가지 않음
    const lines = wrapLines(ctx, t.text, maxBubbleW - 36);
    const textW = Math.max(...lines.map(l => ctx.measureText(l).width));
    const bubbleW = Math.min(maxBubbleW, Math.ceil(textW) + 36);
    // 위 여백 14px + 첫 줄 글자 위치, 아래 여백까지 포함한 높이
    const bubbleH = lines.length * LINE_H + 32;
    const contentH = Math.max(bubbleH, IMG_SD_H);
    return {
      c, lines, bubbleW, bubbleH, contentH,
      side: t.side || 'left',
      src: sdSrcFor(t),
      h: 30 + contentH + 22,
    };
  });
}

function loadImage(src){
  return new Promise(resolve => {
    if(!src){ resolve(null); return; }
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => resolve(null);
    img.src = src;
  });
}

function roundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawBlock(ctx, b, y, img){
  const left = b.side === 'left';
  const top = y + 30;
  const sx = left ? IMG_PAD + IMG_INNER : IMG_W - IMG_PAD - IMG_INNER - IMG_SD_W;
  const bx = left ? sx + IMG_SD_W + IMG_GAP : sx - IMG_GAP - b.bubbleW;
  const bty = top + (b.contentH - b.bubbleH) / 2;
  const sdY = top + (b.contentH - IMG_SD_H) / 2;

  // 발언 당시 표정의 SD
  if(img) ctx.drawImage(img, sx, sdY, IMG_SD_W, IMG_SD_H);

  // 이름
  ctx.font = NAME_FONT; ctx.fillStyle = isDark() ? '#b0b0b0' : '#666';
  ctx.textAlign = left ? 'left' : 'right';
  ctx.textBaseline = 'alphabetic';
  ctx.fillText(nm(b.c), left ? bx + 4 : bx + b.bubbleW - 4, y + 22);

  // 말풍선 (화면과 같은 도형, 배경 = 캐릭터 색)
  ctx.beginPath();
  bubblePoints(bx, bty, b.bubbleW, b.bubbleH, left).forEach((p, i) =>
    i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
  ctx.closePath();
  ctx.fillStyle = b.c.color; ctx.fill();

  // 본문: 줄 가운데 정렬 (세로 가운데)
  const textH = b.lines.length * LINE_H;
  const topText = bty + (b.bubbleH - textH) / 2;
  ctx.font = MSG_FONT; ctx.fillStyle = b.c.textColor || '#fff';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  b.lines.forEach((l, i) => ctx.fillText(l, bx + 18, topText + i * LINE_H + LINE_H / 2));
  ctx.textBaseline = 'alphabetic';
}

function drawPage(blocks, imgMap){
  const H = blocks.reduce((s, b) => s + b.h, 0) + IMG_PAD * 2;
  const canvas = document.createElement('canvas');
  canvas.width = IMG_W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = isDark() ? '#000000' : '#fffaf0'; ctx.fillRect(0, 0, IMG_W, H);
  let y = IMG_PAD;
  blocks.forEach(b => { drawBlock(ctx, b, y, imgMap[b.src]); y += b.h; });
  return canvas;
}

async function saveChatImages(){
  if(!state.history.length){ alert('저장할 대사가 없습니다.'); return; }
  const blocks = layoutMessages(document.createElement('canvas').getContext('2d'));

  // 발언별 SD 이미지를 먼저 모두 불러오기
  const srcs = [...new Set(blocks.map(b => b.src).filter(Boolean))];
  const loaded = await Promise.all(srcs.map(loadImage));
  const imgMap = {};
  srcs.forEach((s, i) => { imgMap[s] = loaded[i]; });

  // 페이지 나누기: 높이 한도를 넘기면 다음 장으로
  const pages = [];
  let cur = [], acc = 0;
  const limit = IMG_MAX_H - IMG_PAD * 2;
  blocks.forEach(b => {
    if(cur.length && acc + b.h > limit){ pages.push(cur); cur = []; acc = 0; }
    cur.push(b); acc += b.h;
  });
  if(cur.length) pages.push(cur);

  const stamp = timeStamp();
  for(let i = 0; i < pages.length; i++){
    const canvas = drawPage(pages[i], imgMap);
    downloadBlob(canvas.toDataURL('image/png'), `대화_${stamp}_${i + 1}.png`);
    await sleep(400);
  }
}
$('imgBtn').onclick = saveChatImages;

/* =====================================================================
   화면 녹화: 현재 탭을 캡처 (초상화, SD 표정 변화 포함). 정지 시 webm 저장
   ===================================================================== */
const rec = { mr: null, stream: null, chunks: [] };

function setRecUI(on){
  const b = $('recBtn');
  b.innerHTML = svgIcon(on ? 'stop' : 'rec');
  b.title = on ? '녹화 정지' : '녹화';
  b.setAttribute('aria-label', b.title);
  b.classList.toggle('rec', on);
}

async function startRecording(){
  let stream;
  try{
    stream = await navigator.mediaDevices.getDisplayMedia({
      video: { frameRate: 30 }, audio: false, preferCurrentTab: true,
    });
  }catch(e){
    alert('녹화를 시작하지 않았습니다. (취소되었거나 권한이 거부됨)\n' + e.message);
    return;
  }
  const mime = ['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm']
    .find(m => MediaRecorder.isTypeSupported(m));
  const mr = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
  rec.mr = mr; rec.stream = stream; rec.chunks = [];

  mr.ondataavailable = e => { if(e.data && e.data.size) rec.chunks.push(e.data); };
  mr.onstop = () => {
    const blob = new Blob(rec.chunks, { type: 'video/webm' });
    const url = URL.createObjectURL(blob);
    downloadBlob(url, `대화녹화_${timeStamp()}.webm`);
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    stream.getTracks().forEach(t => t.stop());
    rec.mr = null; rec.stream = null;
    setRecUI(false);
  };
  // 사용자가 브라우저의 '공유 중지'를 누르면 자동 저장
  stream.getVideoTracks()[0].addEventListener('ended', () => {
    if(rec.mr && rec.mr.state !== 'inactive') rec.mr.stop();
  });

  mr.start(1000);
  setRecUI(true);
}

function stopRecording(){
  if(rec.mr && rec.mr.state !== 'inactive') rec.mr.stop();
}

$('recBtn').onclick = () => { rec.mr ? stopRecording() : startRecording(); };

// 녹화를 지원하지 않는 환경(일부 모바일 등)에서는 버튼 숨김
if(!(navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia && window.MediaRecorder)){
  $('recBtn').style.display = 'none';
}
/* =====================================================================
   대화 저장 · 대화 목록 · 이어하기 · 삭제 (브라우저 저장소에 보관)
   ===================================================================== */
const CHAT_KEY = 'ct_saved_chats';
const LIST_ICON = `<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>`;
$('listBtnSetup').innerHTML = LIST_ICON;
$('listBtnStage').innerHTML = LIST_ICON;

function loadChats(){
  try{ return JSON.parse(localStorage.getItem(CHAT_KEY) || '[]'); }catch(e){ return []; }
}
function storeChats(list){
  try{ localStorage.setItem(CHAT_KEY, JSON.stringify(list)); return true; }
  catch(e){ alert('저장 공간이 부족합니다. 오래된 대화를 삭제해 주세요.'); return false; }
}
function nmById(id){ const c = charById(id); return c ? nm(c) : id; }
function fmtDate(ts){
  return new Date(ts).toLocaleString(state.lang === 'en' ? 'en-US' : 'ko-KR',
    { year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });
}

// AI가 대화 내용을 보고 제목을 한 줄로 지음
async function makeTitle(snap){
  const fallback = (snap.topicMode === FREE_TOPIC ? '자유 주제' : snap.topicText) + ' 대화';
  try{
    const transcript = snap.history.slice(-30)
      .map(m => `${nmById(m.speaker)}: ${m.text}`).join('\n');
    const stable = state.lang === 'en'
      ? 'You name conversations. Read the dialogue and reply with ONE short title (max 30 characters). No quotes, no explanation, title only. Write in English.'
      : '너는 대화 제목을 짓는다. 대화 내용을 보고 핵심이 드러나는 짧은 제목을 한 줄로만 출력한다. 따옴표, 설명, 마크다운 없이 제목만 쓴다. 한국어로 쓴다.';
    const text = await callClaude({ stable, dynamic: '[대화]\n' + transcript });
    const t = text.replace(/["'`]/g, '').trim().split('\n')[0].slice(0, 30);
    return t || fallback;
  }catch(e){
    return fallback;
  }
}

async function saveCurrentChat(){
  if(!state.history.length){ alert('저장할 대화가 없습니다.'); return; }
  const btn = $('saveBtn');
  const snap = {
    id: state.chatId || ('c' + Date.now()),
    savedAt: Date.now(),
    lang: state.lang,
    topicMode: state.topicMode,
    topicText: state.topicText,
    selected: state.selected.map(c => c.id),
    standing: state.standing || '',
    history: state.history.map(t => ({ speaker: t.speaker, emotion: t.emotion, text: t.text })),
    title: '',
  };
  btn.disabled = true;
  $('status').textContent = '대화 제목을 만드는 중...';
  snap.title = await makeTitle(snap);
  btn.disabled = false;
  const list = loadChats().filter(c => c.id !== snap.id);
  list.unshift(snap);
  if(storeChats(list)){
    state.chatId = snap.id;
    $('status').textContent = '저장됨: ' + snap.title;
  }
}
$('saveBtn').onclick = saveCurrentChat;

$('listBtnStage').onclick = toggleList;

function makeBtn(label, primary, onClick){
  const b = document.createElement('button');
  b.className = 'cmd-btn' + (primary ? ' primary' : '');
  b.textContent = label;
  b.onclick = onClick;
  return b;

function renderList(){
  const body = $('listBody');

function deleteChat(id){
  if(!confirm('이 대화를 삭제할까요?')) return;
  storeChats(loadChats().filter(c => c.id !== id));
  renderList();
}

// ----- 이어하기: 저장된 대사를 그대로 복원하고 다음 대사부터 이어서 생성 -----
function resumeChat(id){
  const ch = loadChats().find(c => c.id === id);
  if(!ch) return;
  const inStage = $('stage').style.display === 'grid';
  if(inStage && state.history.length && !confirm('지금 대화는 저장되지 않습니다. 이 대화를 불러올까요?')) return;

  const selected = ch.selected.map(charById).filter(Boolean);
  if(selected.length < 2){ alert('이 대화의 캐릭터 정보를 불러올 수 없습니다.'); return; }

  closeList();
  loopSeq++; fetching = false; state.running = false;
  state.lang = ch.lang === 'en' ? 'en' : 'ko'; safeSet(STORE.lang, state.lang);
  state.topicMode = ch.topicMode; state.topicText = ch.topicText;
  state.chosen = new Set(selected.map(c => c.id));
  state.selected = selected;
  state.history = [];
  state.lastSpeaker = null;
  state.emotion = {};
  state.chatId = ch.id;   // 이 대화를 저장하면 같은 항목을 덮어씀
  state.standing = ch.standing || '';
  updateStandingBtn();
  state.left = selected[0]; state.right = selected[1];

  $('setup').style.display = 'none';
  $('stage').style.display = 'grid';
  $('log').innerHTML = '';
  setStopIcon(true);
  $('status').textContent = '주제: ' + topicLabel();
  renderPortraits(null);
  renderSD(null);
  // 저장된 대사를 순서대로 다시 표시 (슬롯·말풍선 방향·표정 모두 같은 경로로 복원)
  ch.history.forEach(t => showTurn({ speaker: t.speaker, emotion: t.emotion, text: t.text }));
  loopSeq++; state.running = true; fetching = false;
  setStopIcon(true);
  setNextUI();
}

// ----- 삭제 전 확인과 함께 목록 닫기 (Esc) -----
document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && isListOpen()) closeList();
});

/* ---------- 화면 캡쳐 (초상화 · SD · 대화창 포함, 버튼 줄은 제외) ---------- */
$('shotBtn').innerHTML = svgIcon('camera');
$('shotBtn').onclick = captureScreen;

function rectOf(el, base){
  const r = el.getBoundingClientRect();
  return { x: r.left - base.left, y: r.top - base.top, w: r.width, h: r.height };
}
function drawCover(ctx, img, r){
  const s = Math.max(r.w / img.naturalWidth, r.h / img.naturalHeight);
  const dw = img.naturalWidth * s, dh = img.naturalHeight * s;
  ctx.drawImage(img, r.x + (r.w - dw) / 2, r.y + (r.h - dh) / 2, dw, dh);
}
function drawContain(ctx, img, r){
  const s = Math.min(r.w / img.naturalWidth, r.h / img.naturalHeight);
  const dw = img.naturalWidth * s, dh = img.naturalHeight * s;
  ctx.drawImage(img, r.x + (r.w - dw) / 2, r.y + (r.h - dh) / 2, dw, dh);
}
function imgReady(img){ return img && img.complete && img.naturalWidth > 0; }

// 화면에 보이는 줄 그대로 나눠 읽기: 글자 위치의 세로 좌표가 바뀌는 지점을 줄바꿈으로 본다
function domLines(el){
  const node = el.firstChild;
  if(!node || node.nodeType !== 3) return [el.textContent.trim()];
  const text = node.textContent;
  const range = document.createRange();
  const lines = [];
  let cur = '', lastTop = null;
  for(let i = 0; i < text.length; i++){
    range.setStart(node, i); range.setEnd(node, i + 1);
    const rects = range.getClientRects();
    if(rects.length){
      const top = Math.round(rects[0].top);
      if(lastTop !== null && Math.abs(top - lastTop) > 4){ lines.push(cur); cur = ''; }
      lastTop = top;
    }
    cur += text[i];
  }
  if(cur) lines.push(cur);
  return lines.map(s => s.trim()).filter(s => s.length);
}

async function captureScreen(){
  const base = $('stage').getBoundingClientRect();
  const W = Math.round(base.width), H = Math.round(base.height);
  const S = 2;
  const canvas = document.createElement('canvas');
  canvas.width = W * S; canvas.height = H * S;
  const ctx = canvas.getContext('2d');
  ctx.scale(S, S);
  const dark = isDark();
  ctx.fillStyle = dark ? '#000000' : '#fffaf0';
  ctx.fillRect(0, 0, W, H);

  // 좌우 큰 초상화: 패널을 꽉 채우고(비율 유지, 가운데 기준), 이름표 포함
  for(const side of [$('leftSide'), $('rightSide')]){
    const r = rectOf(side, base);
    ctx.save();
    if(side.classList.contains('dim')) ctx.globalAlpha = 0.45;
    ctx.beginPath(); ctx.rect(r.x, r.y, r.w, r.h); ctx.clip();
    const img = side.querySelector('img.sprite');
    if(imgReady(img)){
      drawCover(ctx, img, r);
    }else{
      ctx.fillStyle = dark ? '#1a1a1a' : '#e9e4d6';
      ctx.fillRect(r.x, r.y, r.w, r.h);
    }
    const lab = side.querySelector('.label');
    if(lab){
      const lr = rectOf(lab, base);
      ctx.fillStyle = lab.style.background || '#ffffff';
      roundRect(ctx, lr.x, lr.y, lr.w, lr.h, lr.h / 2); ctx.fill();
      ctx.fillStyle = '#0a0a0a';
      ctx.font = '600 13px "Malgun Gothic","Apple SD Gothic Neo",sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(lab.textContent, lr.x + lr.w / 2, lr.y + lr.h / 2);
      ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    }
    ctx.restore();
  }

  // 가운데 대화창 테두리
  const cr = rectOf(document.querySelector('.center'), base);
  ctx.fillStyle = dark ? '#2e2e2e' : '#e5e5e5';
  ctx.fillRect(cr.x, cr.y, 1, cr.h);
  ctx.fillRect(cr.x + cr.w - 1, cr.y, 1, cr.h);

  // 말풍선과 이름
  const nameColor = dark ? '#b0b0b0' : '#666666';
  const msgFont = '16px "Malgun Gothic","Apple SD Gothic Neo",sans-serif';
  for(const msg of document.querySelectorAll('#log .msg')){
    const left = msg.classList.contains('left');
    const who = msg.querySelector('.who');
    if(who){
      const wr = rectOf(who, base);
      ctx.fillStyle = nameColor;
      ctx.font = '13px "Malgun Gothic","Apple SD Gothic Neo",sans-serif';
      ctx.textBaseline = 'top';
      ctx.textAlign = left ? 'left' : 'right';
      ctx.fillText(who.textContent, left ? wr.x : wr.x + wr.w, wr.y);
      ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    }
    const bubble = msg.querySelector('.bubble');
    const br = rectOf(bubble, base);
    ctx.beginPath();
    bubblePoints(br.x, br.y, br.w, br.h, left).forEach((p, i) =>
      i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
    ctx.closePath();
    ctx.fillStyle = bubble.style.getPropertyValue('--c') || '#ffffff';
    ctx.fill();

    const txtEl = bubble.querySelector('.bubble-text');
    const tcs = getComputedStyle(txtEl);
    const tr = rectOf(txtEl, base);
    const lh = parseFloat(tcs.lineHeight) || parseFloat(tcs.fontSize) * 1.55;
    ctx.font = `${tcs.fontWeight} ${tcs.fontSize} ${tcs.fontFamily}`;
    ctx.fillStyle = bubble.style.getPropertyValue('--tc') || '#ffffff';
    ctx.textBaseline = 'middle';
    domLines(txtEl).forEach((l, i) => ctx.fillText(l, tr.x, tr.y + i * lh + lh / 2));
    ctx.textBaseline = 'alphabetic';
  }

  // 하단 SD 표정
  for(const sd of document.querySelectorAll('#sdRow .sd')){
    const r = rectOf(sd, base);
    const img = sd.querySelector('img');
    if(!imgReady(img)) continue;
    ctx.save();
    if(sd.classList.contains('dim')) ctx.globalAlpha = 0.4;
    drawContain(ctx, img, r);
    ctx.restore();
  }

  downloadBlob(canvas.toDataURL('image/png'), `화면_${timeStamp()}.png`);
}
/* ---------- 앞으로의 전개 지시사항 (삭제할 때까지 계속 참고) ---------- */
ICONS.flag = '<path d="M5 21V4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M5 4h12l-2.5 4 2.5 4H5" fill="currentColor"/>';
$('standingBtn').innerHTML = svgIcon('flag');
$('standingBtn').setAttribute('aria-label', '앞으로의 전개 지시');

    : '';
}
function updateStandingBtn(){
  $('standingBtn').classList.toggle('on', !!state.standing);
}
function openStanding(){
  $('standingOverlay').hidden = false;
  $('standingInput').value = state.standing || '';
  setTimeout(() => $('standingInput').focus(), 0);
}

  state.standing = $('standingInput').value.trim();
  updateStandingBtn();
  closeStanding();
};
$('standingDelete').onclick = () => {
  state.standing = '';
  updateStandingBtn();
  closeStanding();
};
$('standingOverlay').addEventListener('click', e => { if(e.target === $('standingOverlay')) closeStanding(); });
document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && !$('standingOverlay').hidden) closeStanding();
});
